# Authentic-source policy for DocuSage web fallback (Phase 2).
#
# T1 — primary authorities (laws, regulators, official bodies)
# T2 — reputable references (encyclopedias, universities)
# T3 — everything else that is not blocked; used only if T1+T2 are too thin
# block — never used as evidence
#
# Matching is by host suffix: "wikipedia.org" matches en.wikipedia.org.
# Edit this file to tighten or widen what counts as trusted.

block:
  - quora.com
  - answers.com
  - pinterest.com
  - reddit.com
  - facebook.com
  - instagram.com
  - tiktok.com
  - twitter.com
  - x.com
  - youtube.com
  - medium.com
  - blogspot.com
  - wordpress.com
  - tumblr.com
  - wikihow.com
  - fandom.com
  - scribblehub.com
  - linkedin.com
  - yahoo.com
  - msn.com
  - ask.com
  - ehow.com
  - slideplayer.com
  - slideshare.net
  - scribd.com
  - coursehero.com
  - chegg.com
  - brainly.com
  - weebly.com
  - wixsite.com
  - substack.com

